<text x="480.0" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">picks the right service, inside the authority you grant</text>
