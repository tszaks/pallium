<text x="346.9" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">Codex</text>
<rect x="391.4" y="504" width="69.0" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="425.9" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">Devin</text>
<rect x="470.4" y="504" width="264.0" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="602.4" y="524" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">any CLI behind a small wrapper</text>
<text x="480.0" y="572" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#666666" text-anchor="middle" letter-spacing="0">the agent steering Pallium and the agents doing the work can be different models</text>
