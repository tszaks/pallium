<text x="492.2" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">Devin</text>
