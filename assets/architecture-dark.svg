<text x="621.9000000000001" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">you, in a terminal</text>
<line x1="480.0" y1="96" x2="480.0" y2="118" stroke="#666666" stroke-width="1.2"/><path d="M476.0 117 L480.0 124 L484.0 117" fill="none" stroke="#666666" stroke-width="1.2"/>
