<text x="311.3" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">worktrees + patches</text>
<rect x="410.4" y="412" width="170.4" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="495.59999999999997" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">verification gates</text>
<rect x="590.8" y="412" width="154.8" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="668.1999999999999" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">budgets + leases</text>
<rect x="755.6" y="412" width="115.8" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="813.4999999999999" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">run journal</text>
