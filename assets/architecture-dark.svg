<text x="40" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#666666" text-anchor="start" letter-spacing="1.2">SERVICES</text>
