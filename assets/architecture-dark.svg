<text x="108.3" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">start</text>
<text x="108.3" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">plain task → plan</text>
<text x="108.3" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">→ run → report</text>
<rect x="188.7" y="216" width="136.7" height="96" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="257.0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">workflows</text>
<text x="257.0" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">parallel workers,</text>
<text x="257.0" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">gates, resumable runs</text>
<rect x="337.3" y="216" width="136.7" height="96" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="405.7" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">loops</text>
<text x="405.7" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">bounded cycles that</text>
<text x="405.7" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">stop on a named state</text>
<rect x="486.0" y="216" width="136.7" height="96" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="554.3" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">agent teams</text>
<text x="554.3" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">peers sharing a task</text>
<text x="554.3" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">board and a mailbox</text>
<rect x="634.7" y="216" width="136.7" height="96" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="703.0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">repo intelligence</text>
<text x="703.0" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">symbols, risk,</text>
<text x="703.0" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">co-change, knowledge</text>
<rect x="783.3" y="216" width="136.7" height="96" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="851.7" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ededed" text-anchor="middle" letter-spacing="0">sessions</text>
<text x="851.7" y="274" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">recall what past</text>
<text x="851.7" y="291" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">agents did and decided</text>
<text x="40" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#666666" text-anchor="start" letter-spacing="1.2">KERNEL · ONE BINARY, ONE LOCAL DATABASE</text>
<rect x="40" y="366" width="880" height="92" rx="12" fill="#111111" stroke="#2e2e2e" stroke-width="1"/>
<text x="480.0" y="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#ededed" text-anchor="middle" letter-spacing="0">durable state lives here, so work survives a crash, a restart, or the end of a chat</text>
<rect x="88.6" y="412" width="123.6" height="30" rx="15" fill="none" stroke="#2e2e2e"/>
<text x="150.40000000000003" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1a1" text-anchor="middle" letter-spacing="0">SQLite state</text>
