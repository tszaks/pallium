name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.9.6
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Use the stable npm bundled with the Node 24 LTS toolchain. Do NOT
      # `npm install -g npm@latest` here: a recent npm@latest broke
      # `npm publish --provenance` with `Cannot find module 'sigstore'`
      # (MODULE_NOT_FOUND), which failed the 0.9.9 publish. The bundled npm
      # already supports provenance + OIDC trusted publishing.

      - name: Verify package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="$(node -p 'require("./npm/package.json").version')"
          tag_version="$RELEASE_TAG"
          tag_version="${tag_version#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "npm/package.json version $version does not match release tag $RELEASE_TAG" >&2
            exit 1
          fi
          if npm view "pallium@$version" version >/dev/null 2>&1; then
            echo "pallium@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require public downloadable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft | grep -qx false
          mkdir "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-assets"
          version="${RELEASE_TAG#v}"
          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            test -s "pallium_${version}_${platform}.tar.gz"
          done
          test "$(wc -l < checksums.txt)" -eq 4
          sha256sum --check checksums.txt

      - name: Publish with trusted publishing
        if: steps.version.outputs.publish == 'true'
        run: npm publish ./npm --access public --provenance
