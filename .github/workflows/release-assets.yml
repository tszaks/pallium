name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.9.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-assets:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft | grep -qx true

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify release version
        run: |
          package_version="$(node -p 'require("./npm/package.json").version')"
          tag_version="${{ steps.tag.outputs.tag }}"
          tag_version="${tag_version#v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "npm/package.json version $package_version does not match release tag ${{ steps.tag.outputs.tag }}" >&2
            exit 1
          fi

      - name: Test npm wrapper
        run: node npm/scripts/test.js

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Workflow acceptance
        run: |
          go build -o "$RUNNER_TEMP/pallium-test-bin" .
          PALLIUM_BIN="$RUNNER_TEMP/pallium-test-bin" bash scripts/workflow-acceptance.sh

      - name: Build release assets
        run: scripts/build-release-assets.sh "${{ steps.tag.outputs.tag }}"

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          verify_dir="$RUNNER_TEMP/pallium-release-verify"
          mkdir -p "$verify_dir"
          tar -xzf "dist/pallium_${version}_linux_amd64.tar.gz" -C "$verify_dir"
          metadata="$("$verify_dir/pallium_${version}_linux_amd64/pallium" version --json)"
          revision="$(git rev-parse HEAD)"
          jq -e --arg version "v$version" --arg revision "$revision" \
            '.version == $version and .vcs_revision == $revision and .vcs_modified == "false"' \
            <<<"$metadata"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" dist/*.tar.gz dist/checksums.txt

  verify-published-assets:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Verify prepared assets without replacing them
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          cd assets
          version="${RELEASE_TAG#v}"
          for platform in darwin_arm64 darwin_amd64 linux_arm64 linux_amd64; do
            test -s "pallium_${version}_${platform}.tar.gz"
          done
          test "$(wc -l < checksums.txt)" -eq 4
          sha256sum --check checksums.txt
